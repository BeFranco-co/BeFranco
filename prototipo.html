<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeFranco · Prototipo de la billetera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#18202b; --paper:#f5f3ee; --white:#ffffff; --red:#c8102e; --red-soft:#fbe9ec;
    --muted:#5b6470; --line:#e2ded5; --green:#1d6b45; --green-soft:#e3f2ea; --amber:#a35a00; --amber-soft:#fbf0de;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Manrope,system-ui,Arial,sans-serif;background:#e9e6df;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 12px 40px;gap:14px}
  .topbar{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .demo{font-size:12px;color:var(--amber);background:var(--amber-soft);border:1px solid #f0d9b0;padding:6px 10px;border-radius:999px;font-weight:600}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--white)}
  .lang button{border:0;background:none;padding:6px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
  .lang button.on{background:var(--ink);color:var(--paper)}
  .phone{width:100%;max-width:420px;background:var(--paper);border-radius:32px;box-shadow:0 20px 50px rgba(24,32,43,.18);overflow:hidden;display:flex;flex-direction:column;min-height:760px;border:8px solid var(--ink)}
  header.app{background:var(--ink);color:var(--paper);padding:18px 20px 16px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.2px}
  .mark{width:30px;height:30px;background:var(--red);border-radius:8px;display:inline-grid;place-items:center;color:#fff;font-weight:800;font-size:17px;line-height:1;flex:none}
  .mark:before{content:"B"}
  .hello{font-size:13px;color:#c9ced6}
  main{flex:1;padding:18px 16px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--white);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .card.dark{background:var(--ink);color:var(--paper)}
  h2{font-size:20px;font-weight:800}
  h3{font-size:15px;font-weight:700}
  .small{font-size:12px;color:var(--muted)}
  .dark .small{color:#aab2bd}
  .big{font-size:30px;font-weight:800;letter-spacing:-.5px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .bal{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .bal:first-of-type{border-top:0}
  .tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .tag.ok{background:var(--green-soft);color:var(--green)}
  .tag.pend{background:var(--amber-soft);color:var(--amber)}
  .tag.bad{background:var(--red-soft);color:var(--red)}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button.b{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;background:var(--red);color:#fff;flex:1}
  button.b.sec{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
  .dark button.b.sec{background:#2a3442;color:var(--paper);border-color:#3a4555}
  button.b:disabled{opacity:.45;cursor:not-allowed}
  label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
  input,select{width:100%;font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--white);color:var(--ink)}
  input[type=range]{padding:0;border:0;accent-color:var(--red)}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
  .bar{height:10px;background:var(--paper);border-radius:999px;overflow:hidden}
  .bar>div{height:100%;background:var(--red);border-radius:999px;transition:width .4s}
  nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--white);border-top:1px solid var(--line)}
  nav button{border:0;background:none;padding:10px 2px 12px;font:inherit;font-size:10px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
  nav button svg{width:22px;height:22px}
  nav button.on{color:var(--red)}
  .found{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--white)}
  .found.sel{border:2px solid var(--red)}
  .checks{display:flex;flex-direction:column;gap:4px;font-size:12px}
  .checks span{display:flex;gap:6px;align-items:center}
  .alert{border-radius:12px;padding:12px;font-size:13px;line-height:1.45}
  .alert.ok{background:var(--green-soft);color:var(--green)}
  .alert.bad{background:var(--red-soft);color:#8f0b20}
  .alert.warn{background:var(--amber-soft);color:#6e3d00}
  .seg{display:flex;background:var(--paper);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;color:var(--muted);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--line)}
  td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  .modal{position:fixed;inset:0;background:rgba(24,32,43,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .modal.show{display:flex}
  .modal .card{width:100%;max-width:380px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;max-width:90%}
  .toast.show{opacity:1}
  .vcard{background:linear-gradient(135deg,#18202b 0%,#2c3a4d 60%,#c8102e 140%);color:#f5f3ee;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:18px;aspect-ratio:1.586;justify-content:space-between;transition:filter .3s}
  .vcard.frozen{filter:grayscale(1) brightness(.8)}
  .vcard .pan{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:21px;letter-spacing:2px}
  .vcard .lbl{font-size:10px;color:#aab2bd;text-transform:uppercase;letter-spacing:1px}
  .vcard .brandc{display:flex;align-items:center;gap:8px;font-weight:800}
  .mark.sm{width:22px;height:22px;border-radius:6px;font-size:13px}
  .switch{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;font-weight:600}
  .switch input{width:auto;accent-color:var(--red);transform:scale(1.3)}
  .note{font-size:12px;color:var(--muted);max-width:420px;text-align:center;line-height:1.5}
</style>
</head>

<div class="topbar">
  <span class="demo" data-t="demo"></span>

  </nav>
</div>
<p class="note" data-t="foot"></p>

<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>

// ---------- Utilidades ----------
const fmtCOP = n => '$' + Math.round(n).toLocaleString(state.lang==='es'?'es-CO':'en-US');
const fmt2 = n => n.toLocaleString(state.lang==='es'?'es-CO':'en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const short = a => a.slice(0,8)+'…'+a.slice(-6);
const fById = id => FOUNDATIONS.find(f=>f.id===id);
const isVerified = f => f.checks.camara && f.checks.dian && f.checks.sig;
const hex = n => Array.from(crypto.getRandomValues(new Uint8Array(n))).map(b=>b.toString(16).padStart(2,'0')).join('');
const totalCOP = () => state.cop + state.pocket.cop + (state.usdc+state.pocket.usd)*RATE.USD_COP + (state.chf+state.pocket.chf)*RATE.CHF_COP;

function record(fid, amount, ccy, origin){ state.ledger.unshift({ when:new Date(), fid, amount, ccy, origin, tx:'0x'+hex(32) }); }

// ---------- Verificación de direcciones ----------
function checkAddress(addr){
  const a = addr.trim();
  if(!a) return null;
  const exact = FOUNDATIONS.find(f=>f.addr.toLowerCase()===a.toLowerCase());
  if(exact) return isVerified(exact) ? {kind:'ok', f:exact} : {kind:'pend', f:exact};
  const look = FOUNDATIONS.find(f=> a.slice(0,6).toLowerCase()===f.addr.slice(0,6).toLowerCase() && a.slice(-4).toLowerCase()===f.addr.slice(-4).toLowerCase());
  if(look) return {kind:'look', f:look};
  return {kind:'bad'};
}

function buy(cop, store){
  const c=state.card;
  const deny = c.frozen?'blocked':(store==='storeOn'&&!c.online)?'offOnline':(store==='storeNfc'&&!c.nfc)?'offNfc':null;
  if(deny){ c.moves.unshift({store,cop,paid:0,ccy:c.source,ok:false}); toast(t(deny)); render(); return; }
  let paid, round=0, key=c.source.toLowerCase();
  if(c.source==='COP') paid=cop; else if(c.source==='USDC') paid=cop/RATE.USD_COP; else paid=cop/RATE.CHF_COP;
  if(c.roundup){ const chfEq=cop/RATE.CHF_COP; round=+(Math.ceil(chfEq)-chfEq).toFixed(2); if(round===0) round=1; }
  if(state[key]<paid || (round && state.chf<round+(key==='chf'?paid:0))){ toast(t('insufficient')); return; }
  state[key]-=paid;
  if(round){ state.chf-=round; record(c.roundF, round, 'CHF', 'oRound'); }
  c.moves.unshift({store,cop,paid,ccy:c.source,round,ok:true}); toast(t('bought')); render();
}

// ---------- Acciones ----------
function setAddr(a){ state.give.addr=a; render(); }
function pickF(id){ state.give.foundation=id; state.give.addr=''; render(); }
function updateDonateBtn(){ const r=checkAddress(state.give.addr); const f=fById(state.give.foundation);
  const ok = state.give.addr ? (r&&r.kind==='ok') : isVerified(f); const b=document.getElementById('donateBtn'); if(b) b.disabled=!ok; }
function donate(){
  const g=state.give; const r=g.addr?checkAddress(g.addr):{kind:'ok',f:fById(g.foundation)};
  if(!r||r.kind!=='ok') return;
  const bal = g.ccy==='CHF'?'chf':'usdc';
  if(!(g.amount>0) || state[bal]<g.amount){ toast(t('insufficient')); return; }
  state[bal]-=g.amount; record(r.f.id, g.amount, g.ccy, 'oUser'); toast(t('done')); state.give.sub='led'; render();
}
function simExt(){ const f=fById(state.give.foundation); record(f.id, 50, 'USDC', 'oExt'); toast(t('done')); state.give.sub='led'; render(); }
function copyAddr(a){ try{ navigator.clipboard.writeText(a).then(()=>toast(t('copied')),()=>toast(a)); }catch(e){ toast(a); } }
function movePocket(){ if(state.chf<20) return; state.chf-=20; state.pocket.chf+=20; toast(t('moved')); render(); }
function moveUsd(){ if(state.usdc<20) return; state.usdc-=20; state.pocket.usd+=20; toast(t('moved')); render(); }
function moveCop(){ if(state.cop<200000) return; state.cop-=200000; state.pocket.cop+=200000; toast(t('moved')); render(); }
function simMonth(){
  const p=state.pocket;
  const yc = p.cop*(Math.pow(1+APY_COP,1/12)-1), dc = Math.round(yc*p.donatePct/100);
  const yu = p.usd*(Math.pow(1+APY_USD,1/12)-1), du = +(yu*p.donatePct/100).toFixed(2);
  p.cop += yc-dc; p.usd += yu-du; p.earned += yc + yu*RATE.USD_COP; p.months++;
  if(dc>0) record(p.foundation, dc, 'COP', 'oAuto');
  if(du>0) record(p.foundation, du, 'USDC', 'oAuto');
  toast(t('month')); render();
}
function modal(html){ document.getElementById('modalCard').innerHTML=html; document.getElementById('modal').classList.add('show'); }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
function openTopup(){
  modal(`<h2>${t('topupT')}</h2><label>${t('amountCop')}</label><input id="tAmt" type="number" value="200000" min="10000" step="10000">
  <div class="btns"><button class="b sec" onclick="closeModal()">${t('cancel')}</button><button class="b" onclick="doTopup()">${t('confirm')}</button></div>`);
}
function doTopup(){ const v=+document.getElementById('tAmt').value; if(v>0){ state.cop+=v; toast(t('topped')); } closeModal(); render(); }
function openConvert(){
  modal(`<h2>${t('convT')}</h2>
  <label>${t('from')}</label><select id="cFrom" onchange="convPreview()"><option value="cop">COP</option><option value="usdc">USDC</option></select>
  <label>${t('amount')}</label><input id="cAmt" type="number" value="200000" oninput="convPreview()">
  <div class="alert ok" id="cPrev"></div>
  <div class="btns"><button class="b sec" onclick="closeModal()">${t('cancel')}</button><button class="b" onclick="doConvert()">${t('confirm')}</button></div>`);
  convPreview();
}
function convCalc(){ const from=document.getElementById('cFrom').value, amt=+document.getElementById('cAmt').value||0;
  const cop = from==='cop'?amt:amt*RATE.USD_COP; const fee=cop*FEE; return {from,amt,fee,chf:(cop-fee)/RATE.CHF_COP}; }
function convPreview(){ const c=convCalc(); document.getElementById('cPrev').innerHTML=`${t('receive')} <b>${fmt2(c.chf)} CHF</b><br><span style="font-size:12px">${t('fee')}: ${fmtCOP(c.fee)}</span>`; }
function doConvert(){ const c=convCalc(); if(c.amt<=0||state[c.from]<c.amt){ toast(t('insufficient')); return; }
  state[c.from]-=c.amt; state.chf+=c.chf; toast(t('converted')); closeModal(); render(); }

// ---------- Enviar dinero ----------
let sendKind='user', sendPurpose='pay', sendRec='', sendAck=false;
const UNKNOWN_ADDR='0x5B2e9A7c3D10f48E6b9C2a71D4e8F30b6C9a1E57';
function openSend(){
  const w=sendKind==='wallet';
  modal(`<h2>${t('sendT')}</h2>
  <div class="seg"><button id="sk-user" class="${!w?'on':''}" onclick="sendKind='user';sendRec='';openSend()">${t('toUser')}</button><button id="sk-wallet" class="${w?'on':''}" onclick="sendKind='wallet';sendRec='';openSend()">${t('toWallet')}</button></div>
  ${w?`<label>${t('purposeQ')}</label>
  <div class="seg"><button class="${sendPurpose==='pay'?'on':''}" onclick="setPurpose('pay')">${t('pPay')}</button><button class="${sendPurpose==='don'?'on':''}" onclick="setPurpose('don')">${t('pDon')}</button><button class="${sendPurpose==='other'?'on':''}" onclick="setPurpose('other')">${t('pOther')}</button></div>`:''}
  <label>${w?t('recWallet'):t('recUser')}</label>
  <input id="sRec" class="${w?'mono':''}" placeholder="${w?'0x…':'@paola.v / 300 123 4567'}" value="${sendRec}" oninput="sendRec=this.value;sendAck=false;sendCheck()">
  ${w?`<div class="btns"><button class="b sec" onclick="fillSend(FOUNDATIONS[0].addr)">${t('tryVer')}</button><button class="b sec" onclick="fillSend(SCAM_ADDR)">${t('tryLook')}</button><button class="b sec" onclick="fillSend(UNKNOWN_ADDR)">${t('tryUnk')}</button></div>`:''}
  <div class="row" style="gap:8px"><div style="flex:1"><label>${t('amount')}</label><input id="sAmt" type="number" min="1" value="${w?10:50000}"></div>
  <div style="width:110px"><label>${t('ccy')}</label><select id="sCcy">${!w?'<option>COP</option>':''}<option>USDC</option><option>CHF</option></select></div></div>
  <div id="sMsg" class="alert ${w?'warn':'ok'}">${w?t('sendChain'):t('sendFree')}</div>
  <div id="sAct"></div>
  <div class="btns"><button class="b sec" onclick="closeModal()">${t('cancel')}</button><button class="b" id="sBtn" onclick="doSend()">${t('sendBtn')}</button></div>`);
  sendCheck();
}
function setPurpose(p){ sendPurpose=p; sendAck=false; openSend(); }
function fillSend(a){ sendRec=a; sendAck=false; openSend(); }
function goDonate(fid){ const f=fById(fid); closeModal(); state.tab='give'; state.give.sub='found'; state.give.foundation=fid; state.give.addr=f.addr; render(); document.getElementById('view').scrollTop=0; }
function goGive(){ closeModal(); state.tab='give'; state.give.sub='found'; render(); document.getElementById('view').scrollTop=0; }
function sendCheck(){
  if(sendKind!=='wallet') return;
  const a=sendRec.trim(), m=document.getElementById('sMsg'), b=document.getElementById('sBtn'), act=document.getElementById('sAct');
  act.innerHTML=''; b.disabled=false;
  if(!a){ m.className='alert warn'; m.textContent=t('sendChain'); return; }
  if(!/^0x[0-9a-fA-F]{40}$/.test(a)){ m.className='alert bad'; m.textContent=t('badFmt'); b.disabled=true; return; }
  const r=checkAddress(a);
  if(r.kind==='ok'){ m.className='alert ok'; m.innerHTML=t('isVer').replace('{f}','<b>'+r.f.name+'</b>'); act.innerHTML=`<div class="btns"><button class="b" onclick="goDonate('${r.f.id}')">${t('donBtn')}</button></div>`; return; }
  if(r.kind==='pend'){ m.className='alert warn'; m.innerHTML=t('isPend').replace('{f}','<b>'+r.f.name+'</b>'); return; }
  if(r.kind==='look'){ m.className='alert bad'; m.innerHTML='⚠ '+t('lookalike').replace('{f}','<b>'+r.f.name+'</b>'); b.disabled=true; return; }
  if(sendPurpose==='don'){
    m.className='alert bad'; m.textContent=t('notVerDon');
    act.innerHTML=`<div class="btns"><button class="b sec" onclick="goGive()">${t('findBtn')}</button></div><div style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:8px"><input type="checkbox" id="sAck" ${sendAck?'checked':''} onchange="sendAck=this.checked;document.getElementById('sBtn').disabled=!sendAck" style="width:auto;margin-top:2px"><span>${t('ackTxt')}</span></div>`;
    b.disabled=!sendAck; return;
  }
  m.className='alert warn'; m.textContent=t('sendChain');
}
function doSend(){
  const to=(sendKind==='wallet'?sendRec:document.getElementById('sRec').value).trim(), amt=+document.getElementById('sAmt').value, ccy=document.getElementById('sCcy').value;
  if(!to){ toast(t('needRec')); return; }
  if(sendKind==='wallet' && !/^0x[0-9a-fA-F]{40}$/.test(to)){ toast(t('badFmt')); return; }
  const key=ccy.toLowerCase(); if(!(amt>0)||state[key]<amt){ toast(t('insufficient')); return; }
  state[key]-=amt; state.sends.unshift({to: sendKind==='wallet'?short(to):to, kind:sendKind, amount:amt, ccy});
  sendRec=''; sendAck=false; closeModal(); toast(t('sent')); render();
}

// ---------- Render ----------
function render(){
  document.documentElement.lang=state.lang;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));
  const v={home:viewHome,save:viewSave,card:viewCard,give:viewGive}[state.tab];
  document.getElementById('view').innerHTML=v();
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;render();document.getElementById('view').scrollTop=0;}));
document.getElementById('l-es').onclick=()=>{state.lang='es';document.getElementById('l-es').classList.add('on');document.getElementById('l-en').classList.remove('on');render();};
document.getElementById('l-en').onclick=()=>{state.lang='en';document.getElementById('l-en').classList.add('on');document.getElementById('l-es').classList.remove('on');render();};
render();
</script>
</body>
</html>
